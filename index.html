<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0c0c12">
  <meta name="description" content="Moodwave — choose a mood and discover music that fits.">
  <title>Moodwave — Music for every mood</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <a class="brand" href="#" aria-label="Moodwave home">
        <span class="brand-mark" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </span>
        <span>Moodwave</span>
      </a>
      <p class="header-label">Music for every moment</p>
    </header>

    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">Choose your mood</p>
      <h1 id="page-title">What does your<br><span>moment feel like?</span></h1>

      <div class="mood-grid" role="group" aria-label="Choose a mood">
        <button class="mood-card" type="button" data-mood="happy" aria-pressed="false">
          <span class="mood-icon" aria-hidden="true">☀</span>
          <span class="mood-copy"><strong>Happy</strong><small>Bright & uplifting</small></span>
          <span class="mood-arrow" aria-hidden="true">↗</span>
        </button>

        <button class="mood-card" type="button" data-mood="sad" aria-pressed="false">
          <span class="mood-icon" aria-hidden="true">◐</span>
          <span class="mood-copy"><strong>Sad</strong><small>Quiet & reflective</small></span>
          <span class="mood-arrow" aria-hidden="true">↗</span>
        </button>

        <button class="mood-card" type="button" data-mood="calm" aria-pressed="false">
          <span class="mood-icon" aria-hidden="true">≈</span>
          <span class="mood-copy"><strong>Calm</strong><small>Soft & peaceful</small></span>
          <span class="mood-arrow" aria-hidden="true">↗</span>
        </button>

        <button class="mood-card" type="button" data-mood="energetic" aria-pressed="false">
          <span class="mood-icon" aria-hidden="true">ϟ</span>
          <span class="mood-copy"><strong>Energetic</strong><small>Bold & unstoppable</small></span>
          <span class="mood-arrow" aria-hidden="true">↗</span>
        </button>
      </div>
    </section>

    <section class="player" id="player" aria-label="Music player" hidden>
      <div class="player-heading">
        <div>
          <p class="now-playing"><span></span> Now playing</p>
          <h2 id="song-title">Song title</h2>
          <p id="song-artist">Artist</p>
        </div>
        <span class="mood-badge" id="mood-badge">Happy</span>
      </div>

      <div class="video-wrap">
        <iframe id="yt-player" title="YouTube music player" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>

      <div class="player-actions">
        <button class="action action-primary" id="btn-next" type="button">Next song <span aria-hidden="true">→</span></button>
        <button class="action" id="btn-change" type="button">Change mood</button>
      </div>
    </section>

    <footer>© <span id="year"></span> Moodwave</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
